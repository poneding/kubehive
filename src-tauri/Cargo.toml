[package]
name = "kubehive"
version = "0.1.0-alpha.2"
description = "A high-performance multi-cluster Kubernetes desktop client"
authors = ["KubeHive contributors"]
edition = "2021"

[lib]
name = "kubehive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Production Kubernetes data plane.
kube = { version = "1.1", default-features = false, features = ["client", "config", "rustls-tls", "ws"] }
k8s-openapi = { version = "0.25", features = ["v1_31"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
portable-pty = "0.8"
tempfile = "3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2.7.2"
