[package]
name = "kubehive"
version = "0.1.0"
description = "A high-performance multi-cluster Kubernetes desktop client"
authors = ["KubeHive contributors"]
edition = "2021"

[lib]
name = "kubehive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Production data plane (enabled as the prototype grows):
kube = { version = "1.1", default-features = false, features = ["client", "config", "rustls-tls"] }
k8s-openapi = { version = "0.25", features = ["v1_31"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
